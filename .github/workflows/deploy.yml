name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 筆記 = Issues：開新筆記、改標題/內文/label 都觸發重新部署
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          # 內建 token：public repo 讀取即可，避免 runner 共用 IP 撞 API rate limit
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_APP_BASE_URL: /Notes/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
